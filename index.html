.table-block{min-width:0}.patch-table-wrap{width:100%;overflow-x:auto}.patch-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11px}.patch-table th{background:#e9f3f7;color:#28647c;text-align:left;font-size:10px;font-weight:750}.patch-table td,.patch-table th{border:1px solid #d8e3e8;padding:5px 7px;overflow-wrap:anywhere;vertical-align:top;min-height:22px}.patch-table tbody tr:nth-child(even){background:#f8fbfc}.patch-table td[contenteditable]:focus,.patch-table th[contenteditable]:focus{outline:2px solid var(--blue);outline-offset:-2px;background:#fff}.table-continuation{font-size:11px!important;color:#7292a0!important}@media print{.patch-table th,.patch-table tbody tr:nth-child(even){-webkit-print-color-adjust:exact;print-color-adjust:exact}}

/* Document-first editing, contextual settings, responsive shared toolbar */
.layout{display:block}
.studio-canvas{padding:24px 16px 90px;overflow:visible;min-height:calc(100vh - 112px)}
.formatbar{position:sticky;top:65px;z-index:25;display:flex;align-items:center;gap:5px;padding:8px 14px;min-height:48px;background:#fff;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:thin}
.formatbar select,.format-action{font:inherit;white-space:nowrap;border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 9px;color:var(--ink);min-height:32px;cursor:pointer}
.formatbar select{border-color:#dae3e7;background:#fafcfd;max-width:170px}
.format-action:hover,.format-action:focus-visible{background:#eaf5f9;border-color:#c7dce5}
.tool-separator{height:22px;border-left:1px solid #dde4e8;margin:0 5px;flex:none}
.format-spacer{flex:1;min-width:5px}
.studio-properties{position:fixed!important;top:0!important;right:0;bottom:0;left:auto;height:100vh!important;width:min(390px,92vw);z-index:60;display:block!important;visibility:hidden;transform:translateX(105%);transition:transform .18s ease,visibility .18s;overflow:auto;box-shadow:-10px 0 35px #19384722;padding:15px 18px}
.studio-properties.show{visibility:visible;transform:translateX(0)}
.properties-head{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-15px;background:white;padding:12px 0;z-index:2;border-bottom:1px solid var(--border);margin-bottom:14px}
.properties-scrim{position:fixed;inset:0;z-index:59;background:#122a3452;display:none}
.properties-scrim.show{display:block}
.live-edit{cursor:text;outline:1px solid var(--blue);outline-offset:3px;min-height:1.3em}
@media(max-width:600px){.formatbar{top:65px;padding:6px 8px}.studio-canvas{padding:14px 8px}.formatbar select{max-width:130px}.docname{width:36vw}.topbar .brand{display:none}}
@media print{.formatbar,.studio-properties,.properties-scrim{display:none!important}.studio-canvas{padding:0!important;min-height:0!important}.live-edit{outline:0!important}}
.studio-properties{position:fixed!important;top:50%!important;left:50%!important;right:auto!important;bottom:auto!important;transform:translate(-50%,-48%) scale(.98)!important;width:min(560px,calc(100vw - 28px))!important;height:min(76vh,740px)!important;max-height:76vh;overflow-y:auto!important;background:#fff;z-index:61;visibility:hidden;opacity:0;transition:opacity .15s,transform .15s!important;border-radius:14px;box-shadow:0 24px 90px #071d2d44}.studio-properties.show{visibility:visible;opacity:1;transform:translate(-50%,-50%) scale(1)!important}.live-edit{white-space:pre-wrap;min-width:12px;outline:2px solid var(--blue)!important;border-radius:3px;cursor:text}.block .rich-output:hover,.block h4:hover,.block .decision-question:hover{cursor:text}@media print{.studio-properties{display:none!important}}
.block [data-direct-text]{cursor:text;outline:none;min-height:1em}.block [data-direct-text]:focus{outline:1.5px solid var(--blue);outline-offset:2px;border-radius:2px}.block [data-direct-text]:empty:before{content:"Click to type";color:#9aa9b2;pointer-events:none}@media print{.block [data-direct-text]:focus{outline:none}.block [data-direct-text]:empty:before{content:none}}

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), uid=()=>globalThis.crypto?.randomUUID?.()||('id'+Date.now()+Math.random().toString(36).slice(2));const clone=v=>JSON.parse(JSON.stringify(v));
const TYPES={setup:['Required tools & summary','⚒','Two-column introduction'],image:['Image step','▧','Instructions with screenshot'],text:['Text step','☰','Full-width instructions'],checkpoint:['Checkpoint','✓','Confirm successful setup'],troubleshooting:['Troubleshooting','⚠','Problem and resolution'],checklist:['Checklist','☑','Tickable task list'],heading:['Section heading','H','Full-width section heading'],note:['Note / warning','ⓘ','Highlighted guidance'],whatif:['What if…','?','Conditional scenario'],photo:['Full-width image','▣','Image and caption'],decision:['Decision / conditional','◇','Yes/no paths with next actions'],signal:['Signal flow','⇢','Equipment and connections'],procedure:['Numbered procedure','①','Compact ordered instructions'],expected:['Expected result','✓','Verify what should happen'],table:['Table / patch sheet','▦','Editable equipment and reference tables']};
const sampleBlocks=[{type:'setup',tools:'Recording Mac\nBooth iPad\nREAPER\nAudacity\nSubsplash',summary:'Create a new project file in REAPER, record the service, then edit the audio and upload it to the appropriate week.',duration:'8 minutes'},{type:'image',text:'Go to the Recording Mac and open REAPER.',note:'It is pinned to the dock if it is not already open.',side:'right',ratio:'50'},{type:'image',text:'When you open it, you should see the REAPER recording template.',note:'If it is blank, open the saved project template.',side:'right',ratio:'50'},{type:'text',text:'Prepare a new project file for the recording.\nSave the new version and ensure the previous recording is not overwritten.'},{type:'checkpoint',text:'The recording project is prepared and ready for the service.'}].map(b=>({...b,id:uid()}));
const newGuide=(name='Untitled Guide',example=false)=>({id:uid(),title:name,version:'1.0',revised:new Date().toLocaleDateString('en-US',{month:'short',year:'numeric'}),accent:'#177da1',logo:'',blocks:example?clone(sampleBlocks):[],updated:Date.now()});
let db=null,guides=[],guide=null,selected=null,view='home',editorPanel='properties',saveTimer=null,dragId=null;
function openDB(){return new Promise((res,rej)=>{const q=indexedDB.open('playbook-studio-v1',1);q.onupgradeneeded=()=>q.result.createObjectStore('guides',{keyPath:'id'});q.onsuccess=()=>{db=q.result;res()};q.onerror=()=>rej(q.error)})}
function txn(mode='readonly'){return db.transaction('guides',mode).objectStore('guides')}
function allGuides(){return new Promise((res,rej)=>{const q=txn().getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function save(g){return new Promise((res,rej)=>{const q=txn('readwrite').put(g);q.onsuccess=res;q.onerror=()=>rej(q.error)})}
function removeGuide(id){return new Promise((res,rej)=>{const q=txn('readwrite').delete(id);q.onsuccess=res;q.onerror=()=>rej(q.error)})}
function toast(m){const el=$('#toast');el.textContent=m;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',2600)}
function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nl(t){return esc(t).replace(/\n/g,'<br>')}
function bullets(t){return `<ul>${String(t||'').split('\n').filter(s=>s.trim()).map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`}
function rich(b,key='text'){return b[key+'Html']?`<div class="rich-output">${cleanHtml(b[key+'Html'])}</div>`:`<p>${nl(b[key]||'')}</p>`}
function cleanHtml(input){const doc=new DOMParser().parseFromString('<div>'+String(input||'')+'</div>','text/html');const allowed=new Set(['B','STRONG','I','EM','U','UL','OL','LI','P','DIV','BR','KBD','H3','MARK','SPAN']);function walk(node){if(node.nodeType===3)return esc(node.textContent);if(node.nodeType!==1)return '';let inside=Array.from(node.childNodes).map(walk).join('');let tag=node.tagName.toLowerCase();return allowed.has(node.tagName)?(tag==='mark'?`<mark class="note-${['caution','danger'].find(v=>node.classList.contains('note-'+v))||'info'}">${inside}</mark>`:tag==='span'&&node.classList.contains('menu-path')?`<span class="menu-path">${inside}</span>`:`<${tag}>${inside}</${tag}>`):inside}const out=Array.from(doc.body.firstChild.childNodes).map(walk).join('');return out.replace(/(?:<br><\/br>)/gi,'<br>').replace(/(?:<br>\s*){3,}/gi,'<br><br>').replace(/<(p|div)>\s*(?:<br\s*\/?>|&nbsp;|\s)*<\/\1>/gi,'')}
function richField(b,key,label){return `<div class="field"><label>${esc(label)}</label><div class="rich-toolbar"><button type="button" data-cmd="bold" title="Bold"><b>B</b></button><button type="button" data-cmd="italic" title="Italic"><i>I</i></button><button type="button" data-cmd="underline" title="Underline"><u>U</u></button><button type="button" data-cmd="insertUnorderedList" title="Bullets">• List</button><button type="button" data-cmd="insertOrderedList" title="Numbered list">1. List</button><button type="button" data-cmd="indent" title="Nest selected list item (Tab)">→ Indent</button><button type="button" data-cmd="outdent" title="Move list item up a level (Shift+Tab)">← Outdent</button><button type="button" data-cmd="formatBlock" data-value="h3" title="Section heading within the text">Heading</button><button type="button" data-cmd="shortcut" title="Style selected text as a keyboard key or website button">⌘ Button</button><button type="button" data-cmd="menupath" title="Format a selected menu/file path">› Path</button><button type="button" data-cmd="inlinenote" data-level="info" title="Format selected text as an information note">ⓘ Info</button><button type="button" data-cmd="inlinenote" data-level="caution" title="Format selected text as a caution">⚠ Caution</button><button type="button" data-cmd="inlinenote" data-level="danger" title="Format selected text as a danger warning">⛔ Danger</button></div><div class="rich-edit" contenteditable="true" data-rich="${key}" role="textbox" aria-label="${esc(label)}">${b[key+'Html']?cleanHtml(b[key+'Html']):esc(b[key]||'').replace(/\n/g,'<br>')}</div></div>`}
function imageSlot(b){return b.image?`<img class="stepimg" src="${b.image}" alt="Step image">`:`<div class="image-placeholder">＋<br>Upload a screenshot</div>`}
function checklistContent(b){if(b.textHtml){const doc=new DOMParser().parseFromString('<div>'+cleanHtml(b.textHtml)+'</div>','text/html');let output='';for(const n of doc.body.firstChild.children){if(n.tagName==='H3'){output+='<div class="checksection">'+n.innerHTML+'</div>';continue}if(n.tagName==='UL'||n.tagName==='OL'){for(const li of n.querySelectorAll('li'))output+='<div class="checkrow"><span class="checksq"></span><span>'+li.innerHTML+'</span></div>';continue}const t=n.textContent.trim();if(t.startsWith('## '))output+='<div class="checksection">'+esc(t.slice(3))+'</div>';else if(t)output+='<div class="checkrow"><span class="checksq"></span><span>'+n.innerHTML+'</span></div>'}return output}const rows=String(b.text||'').split('\n').map(v=>v.trim()).filter(Boolean);return rows.map(line=>{if(/^#{1,3}\s+/.test(line))return '<div class="checksection">'+esc(line.replace(/^#{1,3}\s+/,''))+'</div>';return '<div class="checkrow"><span class="checksq"></span><span>'+esc(line.replace(/^(?:- |• )/,''))+'</span></div>'}).join('')}
 function issueEntries(b){return Array.isArray(b.entries)&&b.entries.length?b.entries:[{title:b.title||'Problem',text:b.text||'',textHtml:b.textHtml||''}]}
function issuePreview(b){return issueEntries(b).map(e=>`<section class="issue-entry"><div class="troublehead">${esc(e.title||'Untitled')}</div>${rich(e)}</section>`).join('')}

const TABLE_PRESETS={

function tableData(b){if(!Array.isArray(b.columns)||!Array.isArray(b.rows)){const preset=TABLE_PRESETS[b.preset]||TABLE_PRESETS.blank;b.columns=[...preset.columns];b.rows=preset.rows.map(r=>[...r])}return b}
function tableHtml(b,rows=b.rows,offset=0,editable=true){return '<div class="patch-table-wrap"><table class="patch-table"><thead><tr>'+b.columns.map((c,i)=>'<th '+(editable?'contenteditable="true" data-col="'+i+'"':'')+'>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.map((row,j)=>'<tr>'+b.columns.map((c,i)=>'<td '+(editable?'contenteditable="true" data-row="'+(offset+j)+'" data-col="'+i+'"':'')+'>'+esc(row[i]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}

function fitPages(){const blocks=guide.blocks,canvas=$('#papers');if(!canvas)return;const built=[],numbers=[];let n=0;blocks.forEach(b=>{if(b.type==='image'||b.type==='text')n++;numbers.push(n);built.push(renderBlock(b,n))});const pages=[[]];canvas.innerHTML=pageHtml([],1);const page=canvas.querySelector('.paper'),body=page.querySelector('.paperbody');let maxHeight;function calc(){const cs=getComputedStyle(page);const pageHeight=page.offsetHeight||1056;const head=page.querySelector('.paperhead').getBoundingClientRect().height,foot=page.querySelector('.paperfooter').getBoundingClientRect().height;maxHeight=pageHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-head-foot-20}calc();const measure=document.createElement('div');measure.style.cssText='visibility:hidden;position:absolute;left:0;top:0;width:100%;';body.appendChild(measure);blocks.forEach((b,i)=>{if(b.type==='table'){tableData(b);let start=0;while(start<b.rows.length){let count=0;let p=pages[pages.length-1];const used=p.reduce((sum,x)=>sum+x.h,0);for(let end=start+1;end<=b.rows.length;end++){measure.innerHTML=tablePart(b,start,end,start===0);const h=measure.firstElementChild.getBoundingClientRect().height+18;if(h+used>maxHeight)break;count=end-start}if(count===0){if(p.length){pages.push([]);continue}count=1}const end=Math.min(start+count,b.rows.length);measure.innerHTML=tablePart(b,start,end,start===0);p.push({html:tablePart(b,start,end,start===0),h:measure.firstElementChild.getBoundingClientRect().height+18});start=end;if(start<b.rows.length)pages.push([])}return}measure.innerHTML=built[i];const h=measure.firstElementChild.getBoundingClientRect().height+18;let p=pages[pages.length-1];const current=p.reduce((total,k)=>total+k.h,0);if(p.length&&current+h>maxHeight){pages.push([]);p=pages[pages.length-1]}p.push({html:built[i],h})});canvas.innerHTML=pages.map((p,i)=>pageHtml(p.map(x=>x.html),i+1,pages.length)).join('');$('#pagecount').textContent=pages.length+' page'+(pages.length===1?'':'s');bindBlocks()}
function scheduleRender(){guide.updated=Date.now();$('#saveStatus').textContent='Saving…';clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{try{await save(guide);$('#saveStatus').textContent='Saved locally'}catch(e){toast('Unable to save: browser storage may be full');$('#saveStatus').textContent='Save failed'}},300)}

function editContextNode(node,object,key,isRich){
 if(node.isContentEditable)return;
 const previous=node.innerHTML;node.contentEditable='true';node.classList.add('live-edit');node.dataset.liveEdit='true';node.focus();let ended=false;
 const complete=ok=>{if(ended)return;ended=true;node.removeAttribute('contenteditable');delete node.dataset.liveEdit;node.classList.remove('live-edit');if(ok){object[key]=node.innerText;if(isRich)object[key+'Html']=cleanHtml(node.innerHTML);scheduleRender();debouncePages()}else node.innerHTML=previous};
 node.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Escape'){e.preventDefault();complete(false);node.blur()}else if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();complete(true);node.blur()}},{signal:(()=>{const c=new AbortController();node.addEventListener('blur',()=>{complete(true);c.abort()},{once:true});return c.signal})()});
}
function contextualEdit(el,point){
 const b=guide.blocks.find(x=>x.id===el.dataset.id);if(!b)return;
 const selectors={
 setup:[['.toolsgrid>div:first-child .rich-output','tools'],['.toolsgrid>div:nth-child(2) .rich-output','summary']],
 image:[['.split .rich-output','text']],text:[['.rich-output','text']],checkpoint:[['.rich-output','text']],note:[['.note-content .rich-output','text']],expected:[['.expected-result .rich-output','text']],heading:[['h4','title']],decision:[['.decision-question','question'],['.decision-option.yes .rich-output','yes'],['.decision-option.no .rich-output','no']],photo:[['.labeltiny','caption']]
 };
 if(['troubleshooting','whatif'].includes(b.type)){
  const issue=point.closest('.issue-entry'),entries=issueEntries(b),i=issue?Array.from(el.querySelectorAll('.issue-entry')).indexOf(issue):0;
  if(issue&&i>=0){const target=point.closest('.troublehead,.rich-output');if(target){if(!Array.isArray(b.entries))b.entries=entries;const item=b.entries[i],key=target.matches('.troublehead')?'title':'text';editContextNode(target,item,key,key==='text');return}}
  selected=b.id;showProperties();return
 }
 if(b.type==='procedure'){const li=point.closest('.procedure-steps li');if(li){const i=Array.from(el.querySelectorAll('.procedure-steps li')).indexOf(li);const items=String(b.items||'').split('\n');editContextNode(li,{get text(){return items[i]},set text(v){items[i]=v;b.items=items.join('\n')}},'text',false);return}}
 if(b.type==='checklist'||b.type==='signal'){selected=b.id;showProperties();return}
 const matches=(selectors[b.type]||[]).flatMap(([sel,key])=>Array.from(el.querySelectorAll(sel)).map(node=>({node,key})));
 const hit=matches.find(x=>x.node===point||x.node.contains(point))||matches[0];
 if(!hit){selected=b.id;renderInspector();showProperties();return}
 const {node,key}=hit,richKeys=['tools','summary','text','yes','no'];if(node.isContentEditable)return;
 selected=b.id;renderOutline();renderInspector();const previous=node.innerHTML;node.contentEditable='true';node.dataset.liveEdit='true';node.classList.add('live-edit');node.spellcheck=true;
 let done=false;function finish(save){if(done)return;done=true;node.removeAttribute('contenteditable');delete node.dataset.liveEdit;node.classList.remove('live-edit');if(save){b[key]=node.innerText;if(richKeys.includes(key))b[key+'Html']=cleanHtml(node.innerHTML);scheduleRender()}else node.innerHTML=previous;debouncePages()}
 node.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Escape'){e.preventDefault();finish(false);node.blur()}else if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();finish(true);node.blur()}},{signal:(()=>{const controller=new AbortController();node.addEventListener('blur',()=>{finish(true);controller.abort()},{once:true});return controller.signal})()});node.focus();
}

 const savedRanges=new WeakMap();

  const remember=()=>{const sel=window.getSelection();if(sel?.rangeCount&&el.contains(sel.anchorNode)&&el.contains(sel.focusNode))savedRanges.set(el,sel.getRangeAt(0).cloneRange())};
  el.addEventListener('keyup',remember);el.addEventListener('mouseup',remember);el.addEventListener('selectstart',()=>requestAnimationFrame(remember));

   const raw=e.clipboardData?.getData('text/html'),plain=e.clipboardData?.getData('text/plain');
   if(!raw&&!plain)return;
   e.preventDefault();

   const html=raw?cleanHtml(raw):esc(plain).replace(/\r\n?/g,'\n').replace(/\n/g,'<br>');
   document.execCommand('insertHTML',false,html);
   el.dispatchEvent(new Event('input'));

  });
  el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&!window.getSelection()?.anchorNode?.parentElement?.closest('li,ul,ol,h3')){e.preventDefault();document.execCommand('insertLineBreak',false,null)}});

  });
 });
}

  else if(op===O.transform)matrix=mul(matrix,args);
  else if([O.paintImageXObject,O.paintInlineImageXObject,O.paintJpegXObject,O.paintImageXObjectRepeat].includes(op)){
   const p=[[0,0],[1,0],[0,1],[1,1]].map(([x,y])=>[matrix[0]*x+matrix[2]*y+matrix[4],matrix[1]*x+matrix[3]*y+matrix[5]]);
   const x=Math.min(...p.map(v=>v[0])),y=Math.min(...p.map(v=>v[1]));
   const w=Math.max(...p.map(v=>v[0]))-x,h=Math.max(...p.map(v=>v[1]))-y;
   // Ignore tiny icons/logo and large background photos.
   if(w>95&&h>52&&w<page.view[2]*.8&&h<page.view[3]*.7)rects.push({x,y:page.view[3]-y-h,w,h});
  }
 }
 return rects.filter((r,i)=>!rects.some((q,j)=>j<i&&Math.abs(r.x-q.x)<6&&Math.abs(r.y-q.y)<6&&Math.abs(r.w-q.w)<6));
}
function pdfBulletHtml(rows){
 let html='',list=false;
 for(const row of rows){
  const raw=row.s.trim();if(!raw)continue;
  const bullet=/^[•●▪◦‣]\s*/.test(raw);
  const content=esc(raw.replace(/^[•●▪◦‣]\s*/,''));
  if(bullet&&!list){html+='<ul>';list=true}
  if(!bullet&&list){html+='</ul>';list=false}
  html+=bullet?'<li>'+content+'</li>':'<p>'+content+'</p>';
 }
 return html+(list?'</ul>':'');
}
async function importPdf(e){
 const file=e.target.files?.[0];if(!file)return;
 try{
  toast('Reading PDF…');
  if(!window.pdfjsLib)await new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';sc.onload=resolve;sc.onerror=reject;document.head.appendChild(sc)});
  const lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise,g=newGuide(file.name.replace(/\.pdf$/i,''));
  let shots=0,bulletCount=0;
  for(let p=1;p<=Math.min(pdf.numPages,100);p++){
   const page=await pdf.getPage(p),tc=await page.getTextContent();
   const items=tc.items.filter(x=>x.str&&x.str.trim()).map(x=>({s:x.str.trim(),x:x.transform[4],y:x.transform[5],size:Math.abs(x.transform[0]||12)}));
   items.sort((a,b)=>b.y-a.y||a.x-b.x);
   const rows=[];
   for(const t of items){const prev=rows[rows.length-1];if(prev&&Math.abs(prev.y-t.y)<3&&t.x>=prev.x){prev.s+=' '+t.s;prev.xMin=Math.min(prev.xMin,t.x)}else rows.push({...t,xMin:t.x})}
   const blocks=[],ranges=[];let current=null;
   function start(type,title='',y=0){current={id:uid(),type,text:'',title};blocks.push(current);ranges.push({block:current,y});return current}
   let headFound=false;
   for(const row of rows){
    const str=row.s.trim();
    if(!str||/^(Version\s+[\d.]+|Page\s+\d+\s*(of\s+\d+)?)/i.test(str))continue;
    if(!headFound&&p===1&&row.y>page.view[3]*.85&&str.length<95&&!/^(STEP|REQUIRED|SETUP|CHECKPOINT|TROUBLESHOOTING)/i.test(str)){g.title=str;headFound=true;continue}
    if(/^STEP\s+\d+\b/i.test(str)){start('text','',row.y);continue}
    if(/^CHECKPOINT\b/i.test(str)){start('checkpoint','',row.y);continue}
    if(/^TROUBLESHOOTING\b/i.test(str)){start('troubleshooting','Problem',row.y);continue}
    if(/^(REQUIRED TOOLS|REQUIRED EQUIPMENT|SETUP SUMMARY)$/i.test(str)){start('text','',row.y);current.text=str;continue}
    if(!current)start('text','',row.y);
    const bullet=/^[•●▪◦‣]\s*/.test(str)||(/^[-–]\s/.test(str));
    let line=str;
    if(bullet){line='• '+str.replace(/^[•●▪◦‣\-–]\s*/,'');bulletCount++}
    current.text+=(current.text?'\n':'')+line;
    const html=current.text.split('\n').map(x=>({s:x}));current.textHtml=pdfBulletHtml(html);
   }
   const ops=await page.getOperatorList(),regions=pdfImageRegions(page,ops).sort((a,b)=>a.y-b.y);
   // Render only if image regions exist, instead of storing a heavyweight image of every page.
   if(regions.length){
    const scale=1.6,view=page.getViewport({scale});const canvas=document.createElement('canvas');canvas.width=Math.round(view.width);canvas.height=Math.round(view.height);
    await page.render({canvasContext:canvas.getContext('2d'),viewport:view}).promise;
    for(const rect of regions){
     const sx=Math.max(0,Math.floor(rect.x*scale)),sy=Math.max(0,Math.floor(rect.y*scale)),sw=Math.min(canvas.width-sx,Math.ceil(rect.w*scale)),sh=Math.min(canvas.height-sy,Math.ceil(rect.h*scale));
     if(sw<70||sh<40)continue;
     const crop=document.createElement('canvas');crop.width=sw;crop.height=sh;crop.getContext('2d').drawImage(canvas,sx,sy,sw,sh,0,0,sw,sh);
     const image=crop.toDataURL('image/jpeg',.82);
     // Associate picture with the step whose vertical region is closest to its midpoint.
     const pdfMid=page.view[3]-(rect.y+rect.h/2);
     const candidates=ranges.filter(x=>x.block.type==='text');
     let match=null,distance=Infinity;
     for(const x of candidates){const delta=Math.abs(x.y-pdfMid);if(delta<distance){match=x.block;distance=delta}}
     if(match&&distance<125&&!match.image){match.type='image';match.image=image;match.side='right';match.ratio='50';shots++}
     else{blocks.push({id:uid(),type:'photo',image,caption:'Imported screenshot from page '+p});shots++}
    }
   }
   g.blocks.push(...blocks);
  }
  if(!g.blocks.length)throw Error('No text/images identified');
  g.updated=Date.now();await save(g);guides=await allGuides();editGuide(g.id);
  toast('Imported '+shots+' screenshots and preserved '+bulletCount+' bullet items. Review layout.');
 }catch(error){console.error(error);toast('PDF import failed: '+(error?.message||'unknown error'))}
 finally{e.target.value=''}
}

 function topBarFormat(cmd,level){

 else document.execCommand(cmd,false,null);
 editor.dispatchEvent(new Event('input'));
}

function imageUrlFromHtml(html){const doc=new DOMParser().parseFromString(html||'','text/html');const img=doc.querySelector('img[src],img[data-src]');const src=img?.getAttribute('src')||img?.getAttribute('data-src');if(src&&(/^(data:image\/|https?:\/\/|blob:)/i).test(src))return src;return null}
async function imageFromClipboardData(data){
 const file=Array.from(data?.files||[]).find(x=>x.type.startsWith('image/'));if(file)return file;const item=Array.from(data?.items||[]).find(x=>x.type.startsWith('image/'));if(item){const blob=item.getAsFile();if(blob)return blob}
 const html=data?.getData?.('text/html');const src=imageUrlFromHtml(html);
 if(src)return await imageBlobFromUrl(src);
 const plain=data?.getData?.('text/plain')?.trim();if(plain&&/^(https?:\/\/|data:image\/)/i.test(plain))return await imageBlobFromUrl(plain);
 return null;
}
async function imageBlobFromUrl(src){
 if(src.startsWith('data:image/')){const res=await fetch(src);return await res.blob()}
 if(src.startsWith('blob:')||/^https?:\/\//i.test(src)){const res=await fetch(src,{mode:'cors'});if(!res.ok)throw Error('Image URL could not be loaded');const blob=await res.blob();if(!blob.type.startsWith('image/'))throw Error('Clipboard URL is not a direct image');return blob}
 throw Error('Unsupported image source');
}
async function pasteImageToBlock(b,data){
 try{
  let image=await imageFromClipboardData(data);
  if(!image&&navigator.clipboard?.read){const items=await navigator.clipboard.read();for(const item of items){const t=item.types.find(x=>x.startsWith('image/'));if(t){image=await item.getType(t);break}if(item.types.includes('text/html')){const html=await(await item.getType('text/html')).text();const src=imageUrlFromHtml(html);if(src){image=await imageBlobFromUrl(src);break}}}}
  if(!image){toast('Canva did not provide an accessible image. Try its Copy as image option or export PNG.');return}
  await loadImage(image,b)
 }catch(error){console.warn('Clipboard image unavailable:',error);toast('Canva image blocked by clipboard/CORS. Use a screenshot or exported PNG instead.')}
}
window.addEventListener('paste',async e=>{
 if(view!=='editor'||!selected)return;
 const b=guide.blocks.find(x=>x.id===selected);
 if(!b||!['image','photo'].includes(b.type))return;
 const target=e.target;
 if(target?.closest?.('input,textarea,[contenteditable="true"]'))return;
 const types=Array.from(e.clipboardData?.types||[]);
 if(!types.some(t=>t.startsWith('image/')||t==='text/html')&&!Array.from(e.clipboardData?.files||[]).some(f=>f.type.startsWith('image/')))return;
 const src=types.includes('text/html')?imageUrlFromHtml(e.clipboardData.getData('text/html')):null;
 const direct=Array.from(e.clipboardData?.files||[]).some(x=>x.type.startsWith('image/'));
 if(!src&&!direct&&!types.includes('text/plain'))return;
 e.preventDefault();await pasteImageToBlock(b,e.clipboardData)
});
