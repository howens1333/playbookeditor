.whatif-tree-node{min-width:0}
.tree-node-text{border:1px solid #cbdde6;border-radius:7px;padding:10px 12px;background:#f5f9fb;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.4}
.tree-action>.tree-node-text{background:#fff;border-color:#dbe5e9}
.tree-branches{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:15px;padding-top:10px}
.tree-branch{min-width:0;border-left:2px solid #bcd4df;padding-left:10px}
.tree-answer{font-size:10px;font-weight:800;letter-spacing:.07em;color:var(--blue);margin-bottom:5px}
.tree-inspector-node{margin:8px 0;padding:9px;border-left:2px solid #c5dce7}
.tree-inspector-children{margin-left:12px}
.tree-inspector-node textarea{width:100%;box-sizing:border-box;min-height:55px;margin-top:6px}
@media print{.tree-node-text{break-inside:avoid}.tree-branch{break-inside:avoid}.tree-branches{gap:12px}}
</style></head><body>
<div id="app"></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), uid=()=>globalThis.crypto?.randomUUID?.()||('id'+Date.now()+Math.random().toString(36).slice(2));const clone=v=>JSON.parse(JSON.stringify(v));
const TYPES={setup:['Required tools & summary','⚒','Two-column introduction'],image:['Image step','▧','Instructions with screenshot'],text:['Text step','☰','Full-width instructions'],checkpoint:['Checkpoint','✓','Confirm successful setup'],troubleshooting:['Troubleshooting','⚠','Problem and resolution'],checklist:['Checklist','☑','Tickable task list'],heading:['Section heading','H','Full-width section heading'],note:['Note / warning','ⓘ','Highlighted guidance'],whatif:['What if…','?','Conditional scenario'],photo:['Full-width image','▣','Image and caption'],decision:['Decision / conditional','◇','Yes/no paths with next actions'],signal:['Signal flow','⇢','Equipment and connections'],procedure:['Numbered procedure','①','Compact ordered instructions'],expected:['Expected result','✓','Verify what should happen'],table:['Table / patch sheet','▦','Editable equipment and reference tables'],timeline:['Timeline','◷','Vertical or horizontal event sequences'],pagebreak:['Page break','↵','Start the following content on a new page'],newsletter:['Project log','▤','Dated project notes with changes and sections'],layout:['Multi-column layout','▥','Two or three editable columns'],spacer:['Spacer','↕','Adjustable vertical spacing'],card:['Card','▣','Highlighted heading and text']};

let db=null,guides=[],guide=null,selected=null,view='home',editorPanel='properties',saveTimer=null,dragId=null;
function openDB(){return new Promise((res,rej)=>{const q=indexedDB.open('playbook-studio-v1',1);q.onupgradeneeded=()=>q.result.createObjectStore('guides',{keyPath:'id'});q.onsuccess=()=>{db=q.result;res()};q.onerror=()=>rej(q.error)})}

function toast(m){const el=$('#toast');el.textContent=m;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',2600)}
function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function rich(b,key='text'){return b[key+'Html']?`<div class="rich-output">${cleanHtml(b[key+'Html'])}</div>`:`<p>${nl(b[key]||'')}</p>`}
function cleanHtml(input){const doc=new DOMParser().parseFromString('<div>'+String(input||'')+'</div>','text/html');const allowed=new Set(['B','STRONG','I','EM','U','UL','OL','LI','P','DIV','BR','KBD','H3','MARK','SPAN']);function walk(node){if(node.nodeType===3)return esc(node.textContent);if(node.nodeType!==1)return '';let inside=Array.from(node.childNodes).map(walk).join('');let tag=node.tagName.toLowerCase();return allowed.has(node.tagName)?(tag==='mark'?`<mark class="note-${['caution','danger'].find(v=>node.classList.contains('note-'+v))||'info'}">${inside}</mark>`:tag==='span'&&node.classList.contains('menu-path')?`<span class="menu-path">${inside}</span>`:`<${tag}>${inside}</${tag}>`):inside}const out=Array.from(doc.body.firstChild.childNodes).map(walk).join('');return out.replace(/(?:<br><\/br>)/gi,'<br>').replace(/(?:<br>\s*){3,}/gi,'<br><br>').replace(/<(p|div)>\s*(?:<br\s*\/?>|&nbsp;|\s)*<\/\1>/gi,'')}
function richField(b,key,label){return `<div class="field"><label>${esc(label)}</label><div class="rich-toolbar"><button type="button" data-cmd="bold" title="Bold"><b>B</b></button><button type="button" data-cmd="italic" title="Italic"><i>I</i></button><button type="button" data-cmd="underline" title="Underline"><u>U</u></button><button type="button" data-cmd="insertUnorderedList" title="Bullets">• List</button><button type="button" data-cmd="insertOrderedList" title="Numbered list">1. List</button><button type="button" data-cmd="indent" title="Nest selected list item (Tab)">→ Indent</button><button type="button" data-cmd="outdent" title="Move list item up a level (Shift+Tab)">← Outdent</button><button type="button" data-cmd="formatBlock" data-value="h3" title="Section heading within the text">Heading</button><button type="button" data-cmd="shortcut" title="Style selected text as a keyboard key or website button">⌘ Button</button><button type="button" data-cmd="menupath" title="Format a selected menu/file path">› Path</button><button type="button" data-cmd="inlinenote" data-level="info" title="Format selected text as an information note">ⓘ Info</button><button type="button" data-cmd="inlinenote" data-level="caution" title="Format selected text as a caution">⚠ Caution</button><button type="button" data-cmd="inlinenote" data-level="danger" title="Format selected text as a danger warning">⛔ Danger</button></div><div class="rich-edit" contenteditable="true" data-rich="${key}" role="textbox" aria-label="${esc(label)}">${b[key+'Html']?cleanHtml(b[key+'Html']):esc(b[key]||'').replace(/\n/g,'<br>')}</div></div>`}

function checklistContent(b){if(b.textHtml){const doc=new DOMParser().parseFromString('<div>'+cleanHtml(b.textHtml)+'</div>','text/html');let output='';for(const n of doc.body.firstChild.children){if(n.tagName==='H3'){output+='<div class="checksection">'+n.innerHTML+'</div>';continue}if(n.tagName==='UL'||n.tagName==='OL'){for(const li of n.querySelectorAll('li'))output+='<div class="checkrow"><span class="checksq"></span><span>'+li.innerHTML+'</span></div>';continue}const t=n.textContent.trim();if(t.startsWith('## '))output+='<div class="checksection">'+esc(t.slice(3))+'</div>';else if(t)output+='<div class="checkrow"><span class="checksq"></span><span>'+n.innerHTML+'</span></div>'}return output}const rows=String(b.text||'').split('\n').map(v=>v.trim()).filter(Boolean);return rows.map(line=>{if(/^#{1,3}\s+/.test(line))return '<div class="checksection">'+esc(line.replace(/^#{1,3}\s+/,''))+'</div>';return '<div class="checkrow"><span class="checksq"></span><span>'+esc(line.replace(/^(?:- |• )/,''))+'</span></div>'}).join('')}
 function issueEntries(b){return Array.isArray(b.entries)&&b.entries.length?b.entries:[{title:b.title||'Problem',text:b.text||'',textHtml:b.textHtml||''}]}

function treeNodeAt(root,path){let node=root;for(const key of path.split('.').filter(Boolean)){if(!node||node.kind!=='question')return null;node=node[key]}return node}

const TABLE_PRESETS={

function signalLevels(b){
 const raw=String(b.graph||b.nodes||'Source\nOutput');

function moveBlockToCell(id,layoutId,index){const layout=findBlock(layoutId),block=findBlock(id),source=findBlockList(id),cell=layout?.cells?.[index];if(!block||!source||!cell||block===layout||block.type==='layout')return;update(()=>{source.splice(source.indexOf(block),1);cell.blocks=cell.blocks||[];if(!cell.blocks.length){if(cell.title==='Heading')cell.title='';if(cell.text==='Add content here')cell.text=''}cell.blocks.push(block);selected=block.id},true)}
function renderBlock(b,stepNum,editable=true){const heading=b.type==='image'||b.type==='text'?`STEP ${stepNum}`:({checkpoint:'CHECKPOINT',setup:'',checklist:b.title||'CHECKLIST',troubleshooting:'TROUBLESHOOTING',heading:b.title||'SECTION',note:b.title||'NOTE',whatif:'WHAT IF...',photo:'',decision:'DECISION',signal:'SIGNAL FLOW',procedure:b.title||'PROCEDURE',expected:'EXPECTED RESULT'}[b.type]||'');let inner='';switch(b.type){case 'setup':inner=`<div class="toolsgrid"><div><h4>REQUIRED TOOLS</h4>${b.toolsHtml?rich(b,'tools'):bullets(b.tools)}</div><div><h4>SETUP SUMMARY</h4>${b.duration?'<p><b>Estimated time: '+esc(b.duration)+'</b></p>':''}${rich(b,'summary')}</div></div>`;break;case 'image':{const txt=`<div><h4>${heading}</h4>${rich(b)}${b.note||b.noteHtml?`<div class="note"><b>Note:</b> ${rich(b,'note')}</div>`:''}</div>`,img=`<div class="step-image-slot"><div>${imageSlot(b)}${b.caption?`<div class="labeltiny">${esc(b.caption)}</div>`:''}</div></div>`;inner=`<div class="split ${b.ratio==='60'?'ratio60':b.ratio==='40'?'ratio40':''}">${txt+img}</div>`;break;}case 'text':inner=`<h4>${heading}</h4>${rich(b)}${b.note||b.noteHtml?`<div class="note">${rich(b,'note')}</div>`:''}`;break;case 'checkpoint':inner=`<h4>CHECKPOINT</h4>${rich(b)}`;break;case 'troubleshooting':inner=`<h4>TROUBLESHOOTING</h4>${issuePreview(b)}`;break;case 'checklist':inner=`<h4>${esc(heading)}</h4><div class="checks ${b.columns==='2'?'cols2':''}">${checklistContent(b)}</div>`;break;case 'heading':inner=`<h4 style="font-size:22px;margin-bottom:0">${esc(heading)}</h4>`;break;case 'note':inner=`<div class="standalone-note note-${['info','caution','danger'].includes(b.level)?b.level:'info'}"><span class="note-symbol" aria-hidden="true">${b.level==='danger'?'⛔':b.level==='caution'?'⚠':'ⓘ'}</span><div class="note-content">${rich(b)}</div></div>`;break;case 'whatif':inner=`<h4>WHAT IF...</h4>${b.whatifMode==='tree'?`<div class="whatif-tree">${treeMarkup(b.tree||defaultTree())}</div>`:issuePreview(b)}`;b function fitPages(){const blocks=guide.blocks,canvas=$('#papers');if(!canvas)return;
 // Preserve the actual viewport position while rebuilding pages. Page indices are
 // unstable when text or images change pagination.
 const scrollRoot=document.scrollingElement||document.documentElement;
 const previousY=scrollRoot.scrollTop;
 const built=[],numbers=[];let n=0;blocks.forEach(b=>{if(b.type==='image'||b.type==='text')n++;numbers.push(n);built.push(renderBlock(b,n))});const pages=[[]];canvas.innerHTML=pageHtml([],1);const page=canvas.querySelector('.paper'),body=page.querySelector('.paperbody');let maxHeight;function calc(){const cs=getComputedStyle(page);const pageHeight=page.offsetHeight||1056;const head=page.querySelector('.paperhead')?.getBoundingClientRect().height||0,foot=page.querySelector('.paperfooter').getBoundingClientRect().height;maxHeight=pageHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-head-foot-20}calc();const headerHeight=page.querySelector('.paperhead')?.getBoundingClientRect().height||0;const capacity=(index)=>maxHeight+(showPageHeader(1)&&!showPageHeader(index+1)?headerHeight:0);const measure=document.createElement('div');measure.style.cssText='visibility:hidden;position:absolute;left:0;top:0;width:100%;';body.appendChild(measure);blocks.forEach((b,i)=>{if(b.type==='pagebreak'){if(pages[pages.length-1].length)pages.push([]);return}if(b.type==='table'){tableData(b);let start=0;while(start<b.rows.length){let count=0;let p=pages[pages.length-1];const used=p.reduce((sum,x)=>sum+x.h,0);const stopAt=(b.pageBreakRows||[]).find(row=>Number.isInteger(row)&&row>start&&row<b.rows.length);for(let end=start+1;end<=b.rows.length&&(stopAt===undefined||end<=stopAt);end++){measure.innerHTML=tablePart(b,start,end,start===0);const h=measure.firstElementChild.getBoundingClientRect().height+18;if(h+used>capacity(pages.length-1))break;count=end-start}if(count===0){if(p.length){pages.push([]);continue}count=1}const end=Math.min(start+count,b.rows.length);measure.innerHTML=tablePart(b,start,end,start===0);p.push({html:tablePart(b,start,end,start===0),h:measure.firstElementChild.getBoundingClientRect().height+18});start=end;if(start<b.rows.length&&(stopAt===start||count>0))pages.push([])}return}measure.innerHTML=built[i];const h=measure.firstElementChild.getBoundingClientRect().height+18;let p=pages[pages.length-1];const current=p.reduce((total,k)=>total+k.h,0);if(p.length&&current+h>capacity(pages.length-1)){pages.push([]);p=pages[pages.length-1]}p.push({html:built[i],h})});canvas.innerHTML=pages.map((p,i)=>pageHtml(p.map(x=>x.html),i+1,pages.length)).join('');$('#pagecount').textContent=pages.length+' page'+(pages.length===1?'':'s');bindBlocks();

function editContextNode(node,object,key,isRich){
 if(node.isContentEditable)return;

let excelImportPromise;
function loadExcelParser(){
 if(window.XLSX)return Promise.resolve(window.XLSX);
 if(!excelImportPromise)excelImportPromise=new Promise((resolve,reject)=>{
  const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
  script.onload=()=>window.XLSX?resolve(window.XLSX):reject(new Error('Excel parser unavailable'));
  script.onerror=()=>reject(new Error('Cannot load Excel importer. Check your internet connection.'));
  document.head.appendChild(script);
 }).catch(err=>{excelImportPromise=null;throw err});
 return excelImportPromise;
}
async function importExcelToTable(b,file){
 if(!file)return;
 try{
  const XLSX=await loadExcelParser();
  const workbook=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
  const choices=workbook.SheetNames;
  if(!choices.length)throw Error('Workbook has no worksheets');
  let sheetName=choices[0];
  if(choices.length>1){
   const answer=window.prompt('Worksheet to import:\n'+choices.map((name,i)=>(i+1)+'. '+name).join('\n')+'\nEnter a number:', '1');
   if(answer===null)return;
   const index=Number(answer)-1;
   if(!Number.isInteger(index)||index<0||index>=choices.length)throw Error('Choose a valid worksheet number');
   sheetName=choices[index];
  }
  const data=XLSX.utils.sheet_to_json(workbook.Sheets[sheetName],{header:1,blankrows:false,defval:'',raw:false});
  const rows=data.map(row=>Array.from(row||[],v=>String(v??'')));
  if(!rows.length)throw Error('The selected worksheet is empty');
  const firstRow=window.confirm('Use the first Excel row as table column headings?\nOK = headers; Cancel = include it as data');
  const maxCols=Math.max(1,...rows.map(row=>row.length));
  const headers=firstRow?rows.shift():Array.from({length:maxCols},(_,i)=>'Column '+(i+1));
  const count=Math.max(maxCols,headers.length);
  const columns=Array.from({length:count},(_,i)=>headers[i]?.trim()||'Column '+(i+1));
  const body=rows.map(row=>Array.from({length:count},(_,i)=>row[i]||''));
  if(!body.length)body.push(columns.map(()=>''));
  if(!window.confirm('Replace the current table with '+body.length+' rows and '+columns.length+' columns from "'+sheetName+'"?'))return;
  update(()=>{b.columns=columns;b.rows=body;b.preset='blank'},true);
  toast('Excel worksheet imported');
 }catch(err){toast('Import failed: '+(err?.message||err))}
}

async function printSizedImage(src){

  const img=new Image();

   try{
    const edge=1800,scale=Math.min(1,edge/Math.max(img.naturalWidth,img.naturalHeight));

    resolve(jpg.length<src.length?jpg:src);
   }catch{resolve(src)}
  };
  img.onerror=()=>resolve(src);img.src=src;

function pdfImageRegions(page,ops){
 const O=pdfjsLib.OPS,stack=[];let matrix=[1,0,0,1,0,0],rects=[];
 const mul=(a,b)=>[a[0]*b[0]+a[2]*b[1],a[1]*b[0]+a[3]*b[1],a[0]*b[2]+a[2]*b[3],a[1]*b[2]+a[3]*b[3],a[0]*b[4]+a[2]*b[5]+a[4],a[1]*b[4]+a[3]*b[5]+a[5]];
 for(let i=0;i<ops.fnArray.length;i++){
  const op=ops.fnArray[i],args=ops.argsArray[i];
  if(op===O.save)stack.push([...matrix]);
  else if(op===O.restore){if(stack.length)matrix=stack.pop()}
  else if(op===O.transform)matrix=mul(matrix,args);
  else if([O.paintImageXObject,O.paintInlineImageXObject,O.paintJpegXObject,O.paintImageXObjectRepeat].includes(op)){
   const p=[[0,0],[1,0],[0,1],[1,1]].map(([x,y])=>[matrix[0]*x+matrix[2]*y+matrix[4],matrix[1]*x+matrix[3]*y+matrix[5]]);
   const x=Math.min(...p.map(v=>v[0])),y=Math.min(...p.map(v=>v[1]));
   const w=Math.max(...p.map(v=>v[0]))-x,h=Math.max(...p.map(v=>v[1]))-y;
   // Ignore tiny icons/logo and large background photos.
   if(w>95&&h>52&&w<page.view[2]*.8&&h<page.view[3]*.7)rects.push({x,y:page.view[3]-y-h,w,h});
  }
 }

}

window.addEventListener('beforeunload' ,()=>{if(guide&&view==='editor')save(guide)});
(async()=>{try{await openDB();guides=await allGuides();if(!guides.length){const g=newGuide('Recording & Uploading a Service',true);await save(g);guides=[g]}}catch(e){document.body.innerHTML='<main style="padding:40px">Browser storage is unavailable. Please use a normal Safari window rather than private mode.</main>';return}renderHome()})();
