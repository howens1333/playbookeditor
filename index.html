/* Playbook v0.2 refinements */
.block.setup-block{padding:0;border:0;background:transparent;}
.block.setup-block:hover{border:0;}
.toolsgrid{grid-template-columns:1fr 1.5fr;gap:20px;}
.toolsgrid>div{min-width:0;}
.split{align-items:start;}
.stepimg{background:transparent;object-fit:contain;object-position:top center;}
.paperhead{min-height:43px;flex-shrink:0;}

.rich-toolbar button{background:#fff;border:0;border-radius:5px;padding:5px 8px;cursor:pointer;}
.rich-toolbar button:hover{background:#e8f4f9;}
.rich-edit{border:1px solid #d9e1e5;border-top:0;border-radius:0 0 9px 9px;min-height:108px;padding:10px;outline:0;overflow-wrap:anywhere;}
.rich-edit:focus{border-color:var(--blue);}
.rich-output{color:#565f65;overflow-wrap:anywhere;white-space:normal;}
.rich-output p{margin:0 0 5px;white-space:normal;}
.rich-output ul,.rich-output ol{padding-left:22px;margin:4px 0;color:#565f65;white-space:normal;}
.rich-output li{margin:3px 0;}
@media print{
 @page{size:letter;margin:0;}
 html,body{overflow:visible!important;}
 #papers,.paperhead,.paperbody,.paperfooter{visibility:visible!important;}
 .paper{display:flex!important;flex-direction:column!important;width:8.5in!important;height:11in!important;min-height:11in!important;margin:0!important;overflow:hidden!important;}
 .paperhead{display:flex!important;margin-bottom:20px!important;}
 .paper-title{display:block!important;color:#177da1!important;}
 .paperbody{display:block!important;flex:1!important;}
 .paperfooter{margin-top:auto!important;}
 .block.active{outline:0!important;}
}

.step-image-slot{display:flex;justify-content:flex-end;align-items:flex-start;min-width:0;text-align:right}

.paperfooter{display:flex!important;justify-content:space-between;align-items:center;gap:12px}.footer-page{white-space:nowrap}#deselect{font-size:12px}
@media print{.paperfooter{display:flex!important;justify-content:space-between!important;width:calc(100% - 96px)!important}.footer-page{margin-left:auto!important}}

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), uid=()=>globalThis.crypto?.randomUUID?.()||('id'+Date.now()+Math.random().toString(36).slice(2));const clone=v=>JSON.parse(JSON.stringify(v));
const TYPES={setup:['Required tools & summary','⚒','Two-column introduction'],image:['Image step','▧','Instructions with screenshot'],text:['Text step','☰','Full-width instructions'],checkpoint:['Checkpoint','✓','Confirm successful setup'],troubleshooting:['Troubleshooting','⚠','Problem and resolution'],checklist:['Checklist','☑','Tickable task list'],heading:['Section heading','H','Full-width section heading'],note:['Note / warning','ⓘ','Highlighted guidance'],whatif:['What if…','?','Conditional scenario'],photo:['Full-width image','▣','Image and caption']};
const sampleBlocks=[{type:'setup',tools:'Recording Mac\nBooth iPad\nREAPER\nAudacity\nSubsplash',summary:'Create a new project file in REAPER, record the service, then edit the audio and upload it to the appropriate week.',duration:'8 minutes'},{type:'image',text:'Go to the Recording Mac and open REAPER.',note:'It is pinned to the dock if it is not already open.',side:'right',ratio:'50'},{type:'image',text:'When you open it, you should see the REAPER recording template.',note:'If it is blank, open the saved project template.',side:'right',ratio:'50'},{type:'text',text:'Prepare a new project file for the recording.\nSave the new version and ensure the previous recording is not overwritten.'},{type:'checkpoint',text:'The recording project is prepared and ready for the service.'}].map(b=>({...b,id:uid()}));
const newGuide=(name='Untitled Guide',example=false)=>({id:uid(),title:name,version:'1.0',revised:new Date().toLocaleDateString('en-US',{month:'short',year:'numeric'}),accent:'#177da1',logo:'',blocks:example?clone(sampleBlocks):[],updated:Date.now()});
let db=null,guides=[],guide=null,selected=null,view='home',editorPanel='properties',saveTimer=null,dragId=null;
function openDB(){return new Promise((res,rej)=>{const q=indexedDB.open('playbook-studio-v1',1);q.onupgradeneeded=()=>q.result.createObjectStore('guides',{keyPath:'id'});q.onsuccess=()=>{db=q.result;res()};q.onerror=()=>rej(q.error)})}
function txn(mode='readonly'){return db.transaction('guides',mode).objectStore('guides')}
function allGuides(){return new Promise((res,rej)=>{const q=txn().getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function save(g){return new Promise((res,rej)=>{const q=txn('readwrite').put(g);q.onsuccess=res;q.onerror=()=>rej(q.error)})}
function removeGuide(id){return new Promise((res,rej)=>{const q=txn('readwrite').delete(id);q.onsuccess=res;q.onerror=()=>rej(q.error)})}
function toast(m){const el=$('#toast');el.textContent=m;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',2600)}
function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nl(t){return esc(t).replace(/\n/g,'<br>')}
function bullets(t){return `<ul>${String(t||'').split('\n').filter(s=>s.trim()).map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`}
function rich(b,key='text'){return b[key+'Html']?`<div class="rich-output">${cleanHtml(b[key+'Html'])}</div>`:`<p>${nl(b[key]||'')}</p>`}
function cleanHtml(input){const doc=new DOMParser().parseFromString('<div>'+String(input||'')+'</div>','text/html');const allowed=new Set(['B','STRONG','I','EM','U','UL','OL','LI','P','DIV','BR','KBD','H3','MARK']);function walk(node){if(node.nodeType===3)return esc(node.textContent);if(node.nodeType!==1)return '';let inside=Array.from(node.childNodes).map(walk).join('');let tag=node.tagName.toLowerCase();return allowed.has(node.tagName)?`<${tag}>${inside}</${tag}>`:inside}return Array.from(doc.body.firstChild.childNodes).map(walk).join('')}
function richField(b,key,label){return `<div class="field"><label>${esc(label)}</label><div class="rich-toolbar"><button type="button" data-cmd="bold" title="Bold"><b>B</b></button><button type="button" data-cmd="italic" title="Italic"><i>I</i></button><button type="button" data-cmd="underline" title="Underline"><u>U</u></button><button type="button" data-cmd="insertUnorderedList" title="Bullets">• List</button><button type="button" data-cmd="insertOrderedList" title="Numbered list">1. List</button><button type="button" data-cmd="formatBlock" data-value="h3" title="Section heading within the text">Heading</button><button type="button" data-cmd="shortcut" title="Style selected text as a keyboard key or website button">⌘ Key / Button</button><button type="button" data-cmd="inlinenote" title="Insert an inline information note">ⓘ Note</button></div><div class="rich-edit" contenteditable="true" data-rich="${key}" role="textbox" aria-label="${esc(label)}">${b[key+'Html']?cleanHtml(b[key+'Html']):esc(b[key]||'').replace(/\n/g,'<br>')}</div></div>`}
function imageSlot(b){return b.image?`<img class="stepimg" src="${b.image}" alt="Step image">`:`<div class="image-placeholder">＋<br>Upload a screenshot</div>`}
function checklistContent(b){const rows=String(b.text||'').split('\n').map(v=>v.trim()).filter(Boolean);return rows.map(line=>{if(/^#{1,3}\s+/.test(line))return '<div class="checksection">'+esc(line.replace(/^#{1,3}\s+/,''))+'</div>';return '<div class="checkrow"><span class="checksq"></span><span>'+esc(line.replace(/^(?:- |• )/,''))+'</span></div>'}).join('')}
 function renderBlock(b,stepNum,editable=true){const heading=b.type==='image'||b.type==='text'?`STEP ${stepNum}`:({checkpoint:'CHECKPOINT',setup:'',checklist:b.title||'CHECKLIST',troubleshooting:'TROUBLESHOOTING',heading:b.title||'SECTION',note:b.title||'NOTE',whatif:'WHAT IF...',photo:''}[b.type]||'');let inner='';switch(b.type){case 'setup':inner=`<div class="toolsgrid"><div><h4>REQUIRED TOOLS</h4>${bullets(b.tools)}</div><div><h4>SETUP SUMMARY</h4><p>${b.duration?'<b>Estimated time: '+esc(b.duration)+'</b><br>':''}${nl(b.summary)}</p></div></div>`;break;case 'image':{const txt=`<div><h4>${heading}</h4>${rich(b)}${b.note?`<div class="note"><b>Note:</b> ${nl(b.note)}</div>`:''}</div>`,img=`<div class="step-image-slot"><div>${imageSlot(b)}${b.caption?`<div class="labeltiny">${esc(b.caption)}</div>`:''}</div></div>`;inner=`<div class="split ${b.ratio==='60'?'ratio60':b.ratio==='40'?'ratio40':''}">${b.side==='left'?img+txt:txt+img}</div>`;break;}case 'text':inner=`<h4>${heading}</h4>${rich(b)}${b.note?`<div class="note">${nl(b.note)}</div>`:''}`;break;case 'checkpoint':inner=`<h4>CHECKPOINT</h4>${rich(b)}`;break;case 'troubleshooting':inner=`<h4>TROUBLESHOOTING</h4><div class="troublehead">${esc(b.title||'Problem')}</div>${b.textHtml?rich(b):bullets(b.text)}`;break;case 'checklist':inner=`<h4>${esc(heading)}</h4><div class="checks ${b.columns==='2'?'cols2':''}">${checklistContent(b)}</div>`;break;case 'heading':inner=`<h4 style="font-size:22px;margin-bottom:0">${esc(heading)}</h4>`;break;case 'note':inner=`<h4>${esc(heading)}</h4><div class="note-callout note-${['info','caution','danger'].includes(b.level)?b.level:'info'}">${rich(b)}</div>`;break;case 'whatif':inner=`<h4>WHAT IF...</h4><div class="troublehead">${esc(b.title||'Scenario')}</div>${rich(b)}`;break;case 'photo':inner=`${imageSlot(b)}${b.caption?`<div class="labeltiny">${esc(b.caption)}</div>`:''}`;break;default:inner=''}return `<article class="block ${b.id===selected&&editable?'active':''} ${b.type==='checkpoint'?'checkpoint':''} ${b.type==='setup'?'setup-block':''}" data-id="${b.id}" ${editable?'draggable="true" tabindex="0"':''}>${inner}</article>`}

function paperFooter(num,total){return `<div class="paperfooter"><span>Version ${esc(guide.version||'1.0')} | Revised ${esc(guide.revised||'')}</span><span class="footer-page">Page ${num} of ${total}</span></div>`}
function pageHtml(items,num,total=1){return `<section class="paper" data-page="${num}">${paperHeader()}<div class="paperbody">${items.join('')}</div>${paperFooter(num,total)}</section>`}
function fitPages(){const blocks=guide.blocks,canvas=$('#papers');if(!canvas)return;const built=[],numbers=[];let n=0;blocks.forEach(b=>{if(b.type==='image'||b.type==='text')n++;numbers.push(n);built.push(renderBlock(b,n))});const pages=[[]];canvas.innerHTML=pageHtml([],1);const page=canvas.querySelector('.paper'),body=page.querySelector('.paperbody');let maxHeight;function calc(){const cs=getComputedStyle(page);const pageHeight=page.offsetHeight||1056;const head=page.querySelector('.paperhead').getBoundingClientRect().height,foot=page.querySelector('.paperfooter').getBoundingClientRect().height;maxHeight=pageHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-head-foot-20}calc();const measure=document.createElement('div');measure.style.cssText='visibility:hidden;position:absolute;left:0;top:0;width:100%;';body.appendChild(measure);blocks.forEach((b,i)=>{measure.innerHTML=built[i];const h=measure.firstElementChild.getBoundingClientRect().height+18;let p=pages[pages.length-1];const current=p.reduce((total,k)=>total+k.h,0);if(p.length&&current+h>maxHeight){pages.push([]);p=pages[pages.length-1]}p.push({html:built[i],h})});canvas.innerHTML=pages.map((p,i)=>pageHtml(p.map(x=>x.html),i+1,pages.length)).join('');$('#pagecount').textContent=pages.length+' page'+(pages.length===1?'':'s');bindBlocks()}
function scheduleRender(){guide.updated=Date.now();$('#saveStatus').textContent='Saving…';clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{try{await save(guide);$('#saveStatus').textContent='Saved locally'}catch(e){toast('Unable to save: browser storage may be full');$('#saveStatus').textContent='Save failed'}},300)}
function update(mut,needsInspect=false){mut();scheduleRender();fitPages();renderOutline();if(needsInspect)renderInspector()}
function bindBlocks(){document.querySelectorAll('.block').forEach(el=>{el.addEventListener('dblclick',e=>{if(e.target.closest('button,input,textarea'))return;startInlineEdit(el)});el.addEventListener('click',()=>{selected=el.dataset.id;renderInspector();document.querySelectorAll('.block').forEach(x=>x.classList.toggle('active',x.dataset.id===selected));renderOutline()});el.addEventListener('keydown',e=>{if(e.key==='Enter'){selected=el.dataset.id;renderInspector();renderOutline()}});el.addEventListener('dragstart',e=>{dragId=el.dataset.id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId)});el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drop-before')});el.addEventListener('dragleave',()=>el.classList.remove('drop-before'));el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('drop-before');moveBlock(dragId,el.dataset.id)});el.addEventListener('dragend',()=>document.querySelectorAll('.block').forEach(x=>x.classList.remove('drop-before')))});document.querySelectorAll('.stepimg').forEach(img=>{if(!img.complete)img.onload=()=>{if(!img.dataset.measured){img.dataset.measured='1';}}})}
function startInlineEdit(el){
 const b=guide.blocks.find(x=>x.id===el.dataset.id);if(!b||el.querySelector('.quick-edit'))return;
 selected=b.id;renderInspector();renderOutline();document.querySelectorAll('.block').forEach(x=>x.classList.toggle('active',x===el));
 const key=b.type==='setup'?'summary':b.type==='checklist'?'text':b.type==='heading'?'title':b.type==='photo'?'caption':'text';
 const useRich=['image','text','checkpoint','note','whatif','troubleshooting'].includes(b.type);
 const old=useRich?(b[key+'Html']||esc(b[key]||'').replace(/\n/g,'<br>')):esc(b[key]||'').replace(/\n/g,'<br>');
 const target=b.type==='image'?el.querySelector('.split>div:first-child .rich-output,.split>div:first-child p,.split>div:nth-child(2) .rich-output,.split>div:nth-child(2) p'):b.type==='setup'?el.querySelector('.toolsgrid>div:nth-child(2) p'):b.type==='checklist'?el.querySelector('.checks'):b.type==='heading'?el.querySelector('h4'):el.querySelector('.rich-output,.note-callout,.troublehead,.block>p')||el;
 if(!target)return;
 const input=document.createElement('div');input.className='quick-edit';input.contentEditable='true';input.setAttribute('role','textbox');input.setAttribute('aria-label','Edit block text');
 input.innerHTML=useRich?cleanHtml(old):old;
 target.style.display='none';target.insertAdjacentElement('afterend',input);
 let finished=false;function finish(commit){if(finished)return;finished=true;
  if(commit){b[key]=input.innerText;if(useRich)b[key+'Html']=cleanHtml(input.innerHTML);scheduleRender()}
  input.remove();target.style.display='';fitPages();renderInspector();renderOutline();
 }
 input.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Escape'){e.preventDefault();finish(false)}else if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();finish(true)}});
 input.addEventListener('blur',()=>finish(true));input.focus();
}

function renderInspector(){const box=$('#inspector');if(!box)return;const b=guide.blocks.find(b=>b.id===selected);if(!b){box.innerHTML=`<h2 class="inspector-title">Document settings</h2><p class="inspector-desc">Edit the title, version and revised date here. Click any block to edit it; press Escape to return to document settings.</p>${field(guide,'title','Document title')}${field(guide,'version','Version')}${field(guide,'revised','Revised date')}<div class="field"><label>Accent color</label><input type="color" data-field="accent" value="${esc(guide.accent)}"></div><div class="separator"></div><div class="separator"></div><p class="hint"><b>Shortcuts:</b> Esc — deselect · ⌘/Ctrl+S — save · ⌘/Ctrl+P — export PDF · ⌘/Ctrl+D — duplicate selected block · Delete — remove block · Option/Alt+↑/↓ — move block.</p><p class="hint">Changes save in this browser only. Download a project backup if you need to move it to another device.</p>`;bindFields(box,guide);return}let html=`<h2 class="inspector-title">${TYPES[b.type][0]}</h2><p class="inspector-desc">${TYPES[b.type][2]}</p>`;if(['checklist','heading','troubleshooting','whatif','note'].includes(b.type))html+=field(b,'title','Heading / problem');if(b.type==='note')html+=field(b,'level','Callout type','select',[['info','Info (blue)'],['caution','Be careful (yellow)'],['danger','Do not do (red)']]);if(b.type==='setup'){html+=field(b,'tools','Required tools (one per line)','textarea')+field(b,'duration','Estimated time')+field(b,'summary','Setup summary','textarea')}else if(b.type!=='heading'){if(['image','photo'].includes(b.type)){if(b.type==='image')html+=richField(b,'text','Step instructions');html+=`<div class="field"><label>Image</label><input id="imageUpload" type="file" accept="image/*"><div class="btnrow"><button class="btn small" id="pasteImg">Paste from clipboard</button>${b.image?'<button class="btn small" id="clearImg">Remove image</button>':''}</div><div class="hint">Upload or paste screenshots. Images are stored with filter(x=>x.id!==b.id);selected=null},true)}}

function pdfImageRegions(page,ops){
 const O=pdfjsLib.OPS,stack=[];let matrix=[1,0,0,1,0,0],rects=[];
 const mul=(a,b)=>[a[0]*b[0]+a[2]*b[1],a[1]*b[0]+a[3]*b[1],a[0]*b[2]+a[2]*b[3],a[1]*b[2]+a[3]*b[3],a[0]*b[4]+a[2]*b[5]+a[4],a[1]*b[4]+a[3]*b[5]+a[5]];
 for(let i=0;i<ops.fnArray.length;i++){
  const op=ops.fnArray[i],args=ops.argsArray[i];
  if(op===O.save)stack.push([...matrix]);
  else if(op===O.restore){if(stack.length)matrix=stack.pop()}
  else if(op===O.transform)matrix=mul(matrix,args);
  else if([O.paintImageXObject,O.paintInlineImageXObject,O.paintJpegXObject,O.paintImageXObjectRepeat].includes(op)){
   const p=[[0,0],[1,0],[0,1],[1,1]].map(([x,y])=>[matrix[0]*x+matrix[2]*y+matrix[4],matrix[1]*x+matrix[3]*y+matrix[5]]);
   const x=Math.min(...p.map(v=>v[0])),y=Math.min(...p.map(v=>v[1]));
   const w=Math.max(...p.map(v=>v[0]))-x,h=Math.max(...p.map(v=>v[1]))-y;
   // Ignore tiny icons/logo and large background photos.
   if(w>95&&h>52&&w<page.view[2]*.8&&h<page.view[3]*.7)rects.push({x,y:page.view[3]-y-h,w,h});
  }
 }
 return rects.filter((r,i)=>!rects.some((q,j)=>j<i&&Math.abs(r.x-q.x)<6&&Math.abs(r.y-q.y)<6&&Math.abs(r.w-q.w)<6));
}
function pdfBulletHtml(rows){
 let html='',list=false;
 for(const row of rows){
  const raw=row.s.trim();if(!raw)continue;
  const bullet=/^[•●▪◦‣]\s*/.test(raw);
  const content=esc(raw.replace(/^[•●▪◦‣]\s*/,''));
  if(bullet&&!list){html+='<ul>';list=true}
  if(!bullet&&list){html+='</ul>';list=false}
  html+=bullet?'<li>'+content+'</li>':'<p>'+content+'</p>';
 }
 return html+(list?'</ul>':'');
}
async function importPdf(e){
 const file=e.target.files?.[0];if(!file)return;
 try{
  toast('Reading PDF…');
  if(!window.pdfjsLib)await new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';sc.onload=resolve;sc.onerror=reject;document.head.appendChild(sc)});
  const lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise,g=newGuide(file.name.replace(/\.pdf$/i,''));
  let shots=0,bulletCount=0;
  for(let p=1;p<=Math.min(pdf.numPages,100);p++){
   const page=await pdf.getPage(p),tc=await page.getTextContent();
   const items=tc.items.filter(x=>x.str&&x.str.trim()).map(x=>({s:x.str.trim(),x:x.transform[4],y:x.transform[5],size:Math.abs(x.transform[0]||12)}));
   items.sort((a,b)=>b.y-a.y||a.x-b.x);
   const rows=[];
   for(const t of items){const prev=rows[rows.length-1];if(prev&&Math.abs(prev.y-t.y)<3&&t.x>=prev.x){prev.s+=' '+t.s;prev.xMin=Math.min(prev.xMin,t.x)}else rows.push({...t,xMin:t.x})}
   const blocks=[],ranges=[];let current=null;
   function start(type,title='',y=0){current={id:uid(),type,text:'',title};blocks.push(current);ranges.push({block:current,y});return current}
   let headFound=false;
   for(const row of rows){
    const str=row.s.trim();
    if(!str||/^(Version\s+[\d.]+|Page\s+\d+\s*(of\s+\d+)?)/i.test(str))continue;
    if(!headFound&&p===1&&row.y>page.view[3]*.85&&str.length<95&&!/^(STEP|REQUIRED|SETUP|CHECKPOINT|TROUBLESHOOTING)/i.test(str)){g.title=str;headFound=true;continue}
    if(/^STEP\s+\d+\b/i.test(str)){start('text','',row.y);continue}
    if(/^CHECKPOINT\b/i.test(str)){start('checkpoint','',row.y);continue}
    if(/^TROUBLESHOOTING\b/i.test(str)){start('troubleshooting','Problem',row.y);continue}
    if(/^(REQUIRED TOOLS|REQUIRED EQUIPMENT|SETUP SUMMARY)$/i.test(str)){start('text','',row.y);current.text=str;continue}
    if(!current)start('text','',row.y);
    const bullet=/^[•●▪◦‣]\s*/.test(str)||(/^[-–]\s/.test(str));
    let line=str;
    if(bullet){line='• '+str.replace(/^[•●▪◦‣\-–]\s*/,'');bulletCount++}
    current.text+=(current.text?'\n':'')+line;
    const html=current.text.split('\n').map(x=>({s:x}));current.textHtml=pdfBulletHtml(html);
   }
   const ops=await page.getOperatorList(),regions=pdfImageRegions(page,ops).sort((a,b)=>a.y-b.y);
   // Render only if image regions exist, instead of storing a heavyweight image of every page.
   if(regions.length){
    const scale=1.6,view=page.getViewport({scale});const canvas=document.createElement('canvas');canvas.width=Math.round(view.width);canvas.height=Math.round(view.height);
    await page.render({canvasContext:canvas.getContext('2d'),viewport:view}).promise;
    for(const rect of regions){
     const sx=Math.max(0,Math.floor(rect.x*scale)),sy=Math.max(0,Math.floor(rect.y*scale)),sw=Math.min(canvas.width-sx,Math.ceil(rect.w*scale)),sh=Math.min(canvas.height-sy,Math.ceil(rect.h*scale));
     if(sw<70||sh<40)continue;
     const crop=document.createElement('canvas');crop.width=sw;crop.height=sh;crop.getContext('2d').drawImage(canvas,sx,sy,sw,sh,0,0,sw,sh);
     const image=crop.toDataURL('image/jpeg',.82);
     // Associate picture with the step whose vertical region is closest to its midpoint.
     const pdfMid=page.view[3]-(rect.y+rect.h/2);
     const candidates=ranges.filter(x=>x.block.type==='text');
     let match=null,distance=Infinity;
     for(const x of candidates){const delta=Math.abs(x.y-pdfMid);if(delta<distance){match=x.block;distance=delta}}
     if(match&&distance<125&&!match.image){match.type='image';match.image=image;match.side='right';match.ratio='50';shots++}
     else{blocks.push({id:uid(),type:'photo',image,caption:'Imported screenshot from page '+p});shots++}
    }
   }
   g.blocks.push(...blocks);
  }
  if(!g.blocks.length)throw Error('No text/images identified');
  g.updated=Date.now();await save(g);guides=await allGuides();editGuide(g.id);
  toast('Imported '+shots+' screenshots and preserved '+bulletCount+' bullet items. Review layout.');
 }catch(error){console.error(error);toast('PDF import failed: '+(error?.message||'unknown error'))}
 finally{e.target.value=''}
}

ck=()=>{selected=null;fitPages();window.print()};document.querySelectorAll('[data-add]').forEach(el=>el.onclick=()=>addBlock(el.dataset.add));$('#deselect').onclick=deselectBlock;$('#documentSettings').onclick=deselectBlock;$('#papers').addEventListener('click',e=>{if(!e.target.closest('.block'))deselectBlock()});$('#toggleBlocks').onclick=()=>{$('#sidebar').classList.toggle('show');$('#rightbar').classList.remove('show')};$('#toggleProperties').onclick=()=>{$('#rightbar').classList.toggle('show');$('#sidebar').classList.remove('show')};renderOutline();renderInspector();fitPages()}
window.addEventListener('paste',async e=>{if(view!=='editor'||!selected)return;const b=guide.blocks.find(x=>x.id===selected);if(!b||!['image','photo'].includes(b.type))return;const blob=Array.from(e.clipboardData?.files||[]).find(f=>f.type.startsWith('image/'));if(blob){e.preventDefault();await loadImage(blob,b)}});

(async()=>{try{await openDB();guides=await allGuides();if(!guides.length){const g=newGuide('Recording & Uploading a Service',true);await save(g);guides=[g]}}catch(e){document.body.innerHTML='<main style="padding:40px">Browser storage is unavailable. Please use a normal Safari window rather than private mode.</main>';return}renderHome()})();
